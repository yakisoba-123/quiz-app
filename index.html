<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ランダム問題集</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4A90E2">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f5f5f7;
      margin: 0;
      padding: 24px;
      display: flex;
      justify-content: center;
    }
    .card {
      background: white;
      border-radius: 24px;
      padding: 32px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
      transform-origin: top center;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .title-logo { font-weight: bold; font-size: 22px; color: #333; }
    
    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* サイズ調整コントローラー */
    .size-control {
      display: flex;
      align-items: center;
      background: #e9e9eb;
      border-radius: 18px;
      padding: 2px 6px;
    }
    .size-btn {
      background: transparent;
      border: none;
      font-size: 14px;
      font-weight: bold;
      color: #333;
      padding: 6px 8px;
      cursor: pointer;
      border-radius: 12px;
    }
    .size-btn:active { background: #d0d0d4; }
    .size-disp {
      font-size: 13px;
      font-weight: bold;
      color: #555;
      min-width: 44px;
      text-align: center;
      user-select: none;
    }

    .mode-btn {
      background: #e9e9eb;
      border: none;
      padding: 10px 18px;
      border-radius: 18px;
      font-size: 15px;
      cursor: pointer;
    }

    /* 問題文のフォントサイズ */
    .question {
      font-size: 36px;
      font-weight: bold;
      margin-bottom: 28px;
      line-height: 1.4;
      text-align: center;
      color: #1d1d1f;
      word-break: break-word;
    }

    /* 上部4択エリアとオーバーレイの親容器 */
    .main-options-wrapper {
      position: relative;
      margin-bottom: 14px;
    }
    
    /* 2列の選択肢グリッドレイアウト */
    .main-options, .sub-options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    button.opt-btn {
      border-radius: 14px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      line-height: 1.3;
      transition: all 0.2s ease;
    }
    button.opt-btn:active { transform: scale(0.98); }

    /* 上部4択（メイン選択肢）：大きいサイズ */
    button.main-opt {
      padding: 22px 14px;
      font-size: 22px;
      min-height: 110px;
      border: 2px solid #f0edfa;
      background: #ffffff;
      color: #8035e0;
    }
    button.main-opt:active { background: #f0edfa; }

    /* 下部補助選択肢（わからない・この中にはない） */
    button.sub-opt {
      padding: 10px 8px;
      font-size: 15px;
      min-height: 52px;
      border: 1px solid #e5e5ea;
      background: #fafafa;
      color: #666666;
    }
    button.sub-opt:active { background: #ebebeb; }
    
    /* 4択部分に被せる結果表示オーバーレイ */
    .overlay-result {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
      z-index: 10;
      backdrop-filter: blur(4px);
    }
    .overlay-result.correct {
      background: rgba(240, 255, 244, 0.96);
      border: 2px solid #28a745;
      color: #155724;
    }
    .overlay-result.incorrect {
      background: rgba(255, 245, 245, 0.96);
      border: 2px solid #dc3545;
      color: #721c24;
    }

    /* 正解テキストの強調スタイル */
    .ans-highlight {
      font-size: 26px;
      font-weight: bold;
      display: inline-block;
      margin: 4px 2px;
    }
    
    .btn-group { display: flex; gap: 12px; margin-top: 18px; }
    .primary-btn {
      flex: 2; background: #007aff; color: white; text-align: center;
      font-weight: bold; border: none; padding: 18px; border-radius: 14px;
      font-size: 20px; cursor: pointer;
    }
    .danger-btn {
      flex: 1; background: #ff3b30; color: white; text-align: center;
      font-weight: bold; border: none; padding: 18px; border-radius: 14px;
      font-size: 20px; cursor: pointer;
    }
    .quit-btn {
      width: 100%;
      margin-top: 18px;
      background: transparent;
      border: 1px solid #ccc;
      color: #666;
      padding: 14px;
      border-radius: 14px;
      font-size: 16px;
      cursor: pointer;
    }
    .quit-btn:active { background: #f0f0f0; }

    /* スタート画面 */
    .start-box { text-align: center; padding: 12px 0; }
    .section-label {
      font-size: 16px; color: #666; font-weight: bold; margin-bottom: 10px; text-align: left;
    }

    /* モード切替 */
    .mode-selector {
      display: flex; justify-content: center; gap: 12px; margin-bottom: 24px;
    }
    .mode-select-btn {
      flex: 1; padding: 14px 10px; border: 2px solid #007aff; background: #fff;
      color: #007aff; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px;
    }
    .mode-select-btn.active { background: #007aff; color: white; }

    /* 問題数選択 */
    .count-selector {
      display: flex; justify-content: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap;
    }
    .count-btn {
      padding: 14px 22px; border: 2px solid #007aff; background: #fff;
      color: #007aff; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 18px;
    }
    .count-btn.active { background: #007aff; color: white; }

    .custom-count-box {
      display: flex; justify-content: center; align-items: center; gap: 10px;
      margin-bottom: 28px; font-size: 18px; color: #555;
    }
    .custom-count-input {
      width: 100px; padding: 10px 12px; border: 1px solid #ccc;
      border-radius: 10px; text-align: center; font-size: 18px; outline: none;
    }
    .custom-count-input:focus { border-color: #007aff; }

    /* 結果画面 */
    .summary-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
      text-align: center; margin: 24px 0;
    }
    .summary-card {
      background: #f8f9fa; padding: 16px 8px; border-radius: 14px; font-size: 15px;
    }
    .summary-card .val { font-size: 24px; font-weight: bold; margin-top: 6px; }
    
    .tab-group { display: flex; gap: 8px; margin-top: 24px; border-bottom: 2px solid #eee; }
    .tab-btn {
      flex: 1; padding: 12px 6px; border: none; background: none;
      font-size: 16px; font-weight: bold; color: #888; cursor: pointer;
    }
    .tab-btn.active { color: #007aff; border-bottom: 3px solid #007aff; margin-bottom: -2px; }
    .history-list { margin-top: 16px; display: flex; flex-direction: column; gap: 14px; max-height: 450px; overflow-y: auto; }
    .history-item {
      padding: 16px; border-radius: 12px; font-size: 17px; border-left: 6px solid #ccc; background: #f9f9f9;
    }
    .history-item.is-correct { border-left-color: #28a745; background: #f0fff4; }
    .history-item.is-incorrect { border-left-color: #dc3545; background: #fff5f5; }
    .history-q { font-weight: bold; margin-bottom: 6px; font-size: 18px; }
    .history-ans { font-size: 16px; color: #444; line-height: 1.4; }
    .history-exp { font-size: 15px; color: #666; margin-top: 6px; padding-top: 6px; border-top: 1px dashed #ddd; }

    /* 編集画面 */
    textarea {
      width: 100%; height: 280px; border: 1px solid #ccc;
      border-radius: 12px; padding: 14px; font-size: 16px; font-family: monospace; margin-bottom: 8px;
    }
    .format-info {
      font-size: 15px; color: #666; background: #f0f0f5;
      padding: 14px; border-radius: 12px; margin-bottom: 16px; line-height: 1.5;
    }
    .progress-bar-container { width: 100%; background: #e9e9eb; height: 10px; border-radius: 5px; margin-bottom: 16px; overflow: hidden; }
    .progress-bar { height: 100%; background: #007aff; width: 0%; transition: width 0.3s; }
  </style>
</head>
<body>

<div class="card" id="app-card">
  <div class="header">
    <div class="title-logo" id="header-title">ランダム問題集</div>
    <div class="header-right">
      <!-- リアルタイムサイズ調整機能 -->
      <div class="size-control">
        <button class="size-btn" onclick="adjustSize(-10)">小</button>
        <span class="size-disp" id="size-disp">100%</span>
        <button class="size-btn" onclick="adjustSize(10)">大</button>
      </div>
      <button class="mode-btn" id="toggle-mode-btn" onclick="toggleEditMode()">⚙️ 問題の編集</button>
    </div>
  </div>

  <!-- 1. スタート画面 -->
  <div id="start-view" class="start-box">
    <div id="total-registered-info" style="color: #666; font-size: 16px; margin-bottom: 20px;"></div>

    <!-- モード選択 -->
    <div class="section-label">出題モード</div>
    <div class="mode-selector">
      <button class="mode-select-btn active" onclick="selectQuizMode('normal', this)">通常（問題 ➔ 答え）</button>
      <button class="mode-select-btn" onclick="selectQuizMode('reverse', this)">逆出題（答え ➔ 問題）</button>
    </div>
    
    <!-- 問題数選択 -->
    <div class="section-label">出題数</div>
    <div class="count-selector">
      <button class="count-btn active" onclick="selectCount(5, this)">5問</button>
      <button class="count-btn" onclick="selectCount(10, this)">10問</button>
      <button class="count-btn" onclick="selectCount(20, this)">20問</button>
      <button class="count-btn" onclick="selectCount(0, this)">全問</button>
    </div>

    <!-- 任意指定ボックス -->
    <div class="custom-count-box">
      <span>任意指定:</span>
      <input type="number" id="custom-count-input" class="custom-count-input" min="1" placeholder="例: 3" oninput="onCustomInput(this)">
      <span>問</span>
    </div>

    <button class="primary-btn" style="width: 100%; padding: 18px;" onclick="startQuiz()">スタート！</button>
  </div>

  <!-- 2. クイズ画面 -->
  <div id="quiz-view" style="display: none;">
    <div class="progress-bar-container"><div class="progress-bar" id="progress-bar"></div></div>
    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 15px; color: #888; margin-bottom: 12px;">
      <span id="quiz-progress-text">第 1 問 / 5問</span>
      <!-- リアルタイムタイマー -->
      <span id="quiz-timer" style="font-weight: bold; color: #333; font-size: 16px;">⏱️ 00:00</span>
      <span id="quiz-mode-text" style="font-weight: bold; color: #007aff;">通常モード</span>
    </div>
    <div class="question" id="question">問題文がここに入ります</div>
    
    <!-- 4択エリアと結果オーバーレイの容器 -->
    <div class="main-options-wrapper">
      <div class="main-options" id="main-options"></div>
      <div class="overlay-result" id="overlay-result" style="display: none;"></div>
    </div>
    
    <!-- 下部補助選択肢エリア -->
    <div class="sub-options" id="sub-options"></div>

    <button class="primary-btn" id="next-btn" style="display:none; width:100%; margin-top:20px;" onclick="nextQuestion()">次の問題へ</button>
    
    <!-- 中断ボタン -->
    <button class="quit-btn" id="quit-btn" onclick="interruptQuiz()">⏹️ 中断してここまでの結果を見る</button>
  </div>

  <!-- 3. 結果画面 -->
  <div id="result-view" style="display: none;">
    <h3 style="text-align: center; margin-top: 0; font-size: 24px;" id="result-title">🎉 お疲れ様でした！</h3>
    
    <div class="summary-grid">
      <div class="summary-card">正答数<div class="val" id="res-correct" style="color: #28a745;">0</div></div>
      <div class="summary-card">誤答数<div class="val" id="res-incorrect" style="color: #dc3545;">0</div></div>
      <div class="summary-card">正答率<div class="val" id="res-rate" style="color: #007aff;">0%</div></div>
      <div class="summary-card">経過時間<div class="val" id="res-time" style="color: #6f42c1;">00:00</div></div>
    </div>

    <!-- 復習タブ -->
    <div class="tab-group">
      <button class="tab-btn active" onclick="switchTab('incorrect', this)">❌ 不正解 (<span id="count-bad">0</span>)</button>
      <button class="tab-btn" onclick="switchTab('correct', this)">⭕ 正解 (<span id="count-good">0</span>)</button>
      <button class="tab-btn" onclick="switchTab('all', this)">すべて (<span id="count-all">0</span>)</button>
    </div>

    <div class="history-list" id="history-list"></div>

    <div style="margin-top: 24px;">
      <button class="primary-btn" style="width: 100%; margin-bottom: 12px;" onclick="showStartView()">もう一度挑戦する</button>
    </div>
  </div>

  <!-- 4. 問題入力・編集画面 -->
  <div id="edit-view" style="display: none;">
    <div class="format-info">
      <strong>【入力フォーマット】</strong><br>
      <code>問題文, 正解, 解説（省略可）</code><br>
      ※解説がない問題は「問題文, 正解」のみで記述可能です。<br>
      ※「逆出題」選択時は自動的に「正解 ➔ 問題文」で出題されます。
    </div>
    <textarea id="data-input" placeholder="ここにテキストを貼り付けてください"></textarea>
    
    <div class="btn-group">
      <button class="primary-btn" onclick="saveQuestions()">保存して適用</button>
      <button class="danger-btn" onclick="clearAllData()">全消去</button>
    </div>
  </div>
</div>

<script>
  // 初期サンプルデータ
  const defaultCSV = `日本の首都は？,東京
「Apple」の意味は？,りんご,バラ科リンゴ属の果実です。
太陽系で最も大きい惑星は？,木星
徳川家康が開いた幕府は？,江戸幕府,1603年に開かれました。
フランスの首都は？,パリ
日本の最高峰の山は？,富士山,標高3776mの独立峰です。
世界で一番広い海洋は？,太平洋
夏目漱石の代表作で「吾輩は〇〇である」の〇〇は？,猫`;

  let questions = [];
  let answerPool = [];
  let questionPool = [];
  
  // クイズセッション用変数
  let sessionQuestions = [];
  let quizMode = 'normal';
  let selectedCount = 5;
  let currentStep = 0;
  let historyData = [];
  let currentCorrectAnswer = "";
  let isEditMode = false;

  // タイマー用変数
  let startTime = 0;
  let timerInterval = null;
  let totalElapsedStr = "00:00";

  // 全体サイズ調整用変数
  let currentScale = 100;

  function init() {
    // 保存済みサイズの読み込み
    const savedScale = localStorage.getItem('user_quiz_scale');
    if (savedScale) {
      currentScale = parseInt(savedScale, 10);
    }
    applyScale();

    const savedData = localStorage.getItem('user_quiz_data');
    const initialData = savedData !== null ? savedData : defaultCSV;
    document.getElementById('data-input').value = initialData;
    parseAndSetQuestions(initialData);
    showStartView();
  }

  function adjustSize(delta) {
    currentScale += delta;
    if (currentScale < 70) currentScale = 70;
    if (currentScale > 150) currentScale = 150;
    localStorage.setItem('user_quiz_scale', currentScale);
    applyScale();
  }

  function applyScale() {
    const card = document.getElementById('app-card');
    card.style.zoom = currentScale / 100;
    document.getElementById('size-disp').textContent = `${currentScale}%`;
  }

  function parseAndSetQuestions(text) {
    const lines = text.trim().split('\n');
    questions = [];
    answerPool = [];
    questionPool = [];

    lines.forEach(line => {
      if (!line.trim()) return;
      const cols = line.includes('\t') ? line.split('\t') : line.split(',');
      
      if (cols.length >= 2) {
        const q = cols[0].trim();
        const ans = cols[1].trim();
        const exp = (cols[2] && cols[2].trim()) ? cols[2].trim() : "";

        questions.push({ q, ans, exp });
        if (!answerPool.includes(ans)) answerPool.push(ans);
        if (!questionPool.includes(q)) questionPool.push(q);
      }
    });
  }

  function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // タイマー処理
  function startTimer() {
    startTime = Date.now();
    updateTimerDisplay();
    clearInterval(timerInterval);
    timerInterval = setInterval(updateTimerDisplay, 1000);
  }

  function stopTimer() {
    clearInterval(timerInterval);
  }

  function updateTimerDisplay() {
    const elapsedSec = Math.floor((Date.now() - startTime) / 1000);
    const mins = String(Math.floor(elapsedSec / 60)).padStart(2, '0');
    const secs = String(elapsedSec % 60).padStart(2, '0');
    totalElapsedStr = `${mins}:${secs}`;
    document.getElementById('quiz-timer').textContent = `⏱️ ${totalElapsedStr}`;
  }

  function showStartView() {
    stopTimer();
    hideAllViews();
    document.getElementById('start-view').style.display = 'block';
    document.getElementById('header-title').textContent = "ランダム問題集";
    document.getElementById('total-registered-info').textContent = `（登録問題数: 全 ${questions.length} 問）`;
  }

  function selectQuizMode(mode, btn) {
    quizMode = mode;
    document.querySelectorAll('.mode-select-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
  }

  function selectCount(count, btn) {
    selectedCount = count;
    document.querySelectorAll('.count-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    document.getElementById('custom-count-input').value = '';
  }

  function onCustomInput(input) {
    document.querySelectorAll('.count-btn').forEach(b => b.classList.remove('active'));
    const val = parseInt(input.value, 10);
    if (!isNaN(val) && val > 0) {
      selectedCount = val;
    }
  }

  function startQuiz() {
    if (questions.length === 0) {
      alert("問題が登録されていません。「⚙️ 問題の編集」から問題を追加してください。");
      return;
    }

    const customInput = document.getElementById('custom-count-input');
    const customVal = parseInt(customInput.value, 10);

    let targetCount = selectedCount;
    if (!isNaN(customVal) && customVal > 0) {
      targetCount = customVal;
    }

    if (targetCount === 0) {
      targetCount = questions.length;
    }

    if (!targetCount || targetCount <= 0) {
      alert("1以上の問題数を入力または選択してください。");
      return;
    }

    const limit = Math.min(targetCount, questions.length);
    
    const shuffled = shuffle(questions);
    sessionQuestions = shuffled.slice(0, limit);
    
    currentStep = 0;
    historyData = [];

    hideAllViews();
    document.getElementById('quiz-view').style.display = 'block';
    startTimer();
    loadQuestion();
  }

  function loadQuestion() {
    document.getElementById('overlay-result').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';

    const qTotal = sessionQuestions.length;
    const qCurrent = currentStep + 1;
    const isNormal = (quizMode === 'normal');
    
    document.getElementById('quiz-progress-text').textContent = `第 ${qCurrent} 問 / 全 ${qTotal} 問`;
    document.getElementById('quiz-mode-text').textContent = isNormal ? "通常モード" : "逆出題モード";
    document.getElementById('progress-bar').style.width = `${((qCurrent - 1) / qTotal) * 100}%`;

    const currentQ = sessionQuestions[currentStep];
    
    const promptText = isNormal ? currentQ.q : currentQ.ans;
    const targetAns = isNormal ? currentQ.ans : currentQ.q;
    const currentPool = isNormal ? answerPool : questionPool;

    document.getElementById('question').textContent = promptText;

    const dummyPool = currentPool.filter(item => item !== targetAns);
    const makeNoneCorrect = (dummyPool.length >= 4) && (Math.random() < 0.25);

    let topFourOpts = [];
    if (makeNoneCorrect) {
      const shuffledDummies = shuffle(dummyPool);
      topFourOpts = shuffledDummies.slice(0, 4);
      currentCorrectAnswer = "この中にはない";
    } else {
      currentCorrectAnswer = targetAns;
      const shuffledDummies = shuffle(dummyPool);
      const neededDummies = Math.min(3, shuffledDummies.length);
      const chosenDummies = shuffledDummies.slice(0, neededDummies);
      topFourOpts = shuffle([targetAns, ...chosenDummies]);
    }

    const mainOptsDiv = document.getElementById('main-options');
    const subOptsDiv = document.getElementById('sub-options');
    mainOptsDiv.innerHTML = '';
    subOptsDiv.innerHTML = '';
    
    // 上部4択
    topFourOpts.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn main-opt';
      btn.textContent = opt;
      btn.onclick = () => checkAnswer(opt);
      mainOptsDiv.appendChild(btn);
    });

    // 下部補助ボタン
    const dontKnowBtn = document.createElement('button');
    dontKnowBtn.className = 'opt-btn sub-opt';
    dontKnowBtn.textContent = 'わからない';
    dontKnowBtn.onclick = () => checkAnswer('わからない');
    subOptsDiv.appendChild(dontKnowBtn);

    const noneBtn = document.createElement('button');
    noneBtn.className = 'opt-btn sub-opt';
    noneBtn.textContent = 'この中にはない';
    noneBtn.onclick = () => checkAnswer('この中にはない');
    subOptsDiv.appendChild(noneBtn);
  }

  function checkAnswer(selected) {
    const currentQ = sessionQuestions[currentStep];
    const isNormal = (quizMode === 'normal');
    const promptText = isNormal ? currentQ.q : currentQ.ans;
    const realAns = isNormal ? currentQ.ans : currentQ.q;
    
    const isCorrect = (selected === 'わからない') ? false : (selected === currentCorrectAnswer);

    historyData.push({
      promptText: promptText,
      realAns: realAns,
      exp: currentQ.exp,
      selected: selected,
      correctAnswer: currentCorrectAnswer,
      isCorrect: isCorrect
    });

    const overlayDiv = document.getElementById('overlay-result');

    // 「この中にはない」を選択した場合のみ、4択エリアに被せる形で正解/不正解を表示
    if (selected === 'この中にはない') {
      overlayDiv.style.display = 'flex';
      overlayDiv.className = 'overlay-result ' + (isCorrect ? 'correct' : 'incorrect');
      
      let resultHTML = `<div style="font-size: 22px; font-weight: bold; margin-bottom: 6px;">${isCorrect ? '⭕ 正解！' : '❌ 不正解...'}</div>`;
      
      if (isCorrect) {
        resultHTML += `<div style="font-size: 16px;">本当の正解は「<span class="ans-highlight">${realAns}</span>」です。</div>`;
      } else {
        resultHTML += `<div style="font-size: 16px;">正解は「<span class="ans-highlight">${currentCorrectAnswer}</span>」です。</div>`;
      }

      if (currentQ.exp) {
        resultHTML += `<div style="margin-top: 8px; font-size: 14px; color: #555;">${currentQ.exp}</div>`;
      }

      overlayDiv.innerHTML = resultHTML;
    } else {
      overlayDiv.style.display = 'none';
    }

    // 回答後の各選択肢ボタンの表示制御
    const mainBtns = document.getElementById('main-options').getElementsByTagName('button');
    const subBtns = document.getElementById('sub-options').getElementsByTagName('button');
    const allBtns = [...mainBtns, ...subBtns];

    for (let btn of allBtns) {
      btn.disabled = true;
      const isThisBtnCorrect = (btn.textContent === currentCorrectAnswer);

      if (isThisBtnCorrect) {
        btn.style.background = "#d4edda";
        btn.style.borderColor = "#28a745";
        btn.style.color = "#155724";
      } else if (!isCorrect && btn.textContent === selected) {
        btn.style.background = "#f8d7da";
        btn.style.borderColor = "#dc3545";
        btn.style.color = "#721c24";
      } else {
        btn.style.opacity = "0.4";
      }
    }

    const nextBtn = document.getElementById('next-btn');
    nextBtn.textContent = (currentStep + 1 === sessionQuestions.length) ? "結果を見る" : "次の問題へ";
    nextBtn.style.display = 'block';
  }

  function nextQuestion() {
    currentStep++;
    if (currentStep < sessionQuestions.length) {
      loadQuestion();
    } else {
      showResultView();
    }
  }

  function interruptQuiz() {
    if (historyData.length === 0) {
      if (confirm("まだ1問も回答していません。クイズを終了してスタート画面に戻りますか？")) {
        showStartView();
      }
      return;
    }

    if (confirm(`現在 ${historyData.length} 問目まで回答済みです。ここで中断して結果を見ますか？`)) {
      showResultView(true);
    }
  }

  function showResultView(isInterrupted = false) {
    stopTimer();
    hideAllViews();
    document.getElementById('result-view').style.display = 'block';

    document.getElementById('result-title').textContent = isInterrupted ? "⏹️ 回答を中断しました" : "🎉 お疲れ様でした！";

    const total = historyData.length;
    const correctCount = historyData.filter(h => h.isCorrect).length;
    const incorrectCount = total - correctCount;
    const rate = total > 0 ? Math.round((correctCount / total) * 100) : 0;

    document.getElementById('res-correct').textContent = `${correctCount}問`;
    document.getElementById('res-incorrect').textContent = `${incorrectCount}問`;
    document.getElementById('res-rate').textContent = `${rate}%`;
    document.getElementById('res-time').textContent = totalElapsedStr;

    document.getElementById('count-bad').textContent = incorrectCount;
    document.getElementById('count-good').textContent = correctCount;
    document.getElementById('count-all').textContent = total;

    const firstTab = incorrectCount > 0 ? 'incorrect' : 'all';
    const firstTabBtn = document.querySelectorAll('.tab-btn')[incorrectCount > 0 ? 0 : 2];
    switchTab(firstTab, firstTabBtn);
  }

  function switchTab(type, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');

    const listDiv = document.getElementById('history-list');
    listDiv.innerHTML = '';

    let filtered = historyData;
    if (type === 'correct') filtered = historyData.filter(h => h.isCorrect);
    if (type === 'incorrect') filtered = historyData.filter(h => !h.isCorrect);

    if (filtered.length === 0) {
      listDiv.innerHTML = `<div style="text-align:center; color:#888; padding: 20px;">該当する問題はありません</div>`;
      return;
    }

    filtered.forEach((item) => {
      const div = document.createElement('div');
      div.className = `history-item ${item.isCorrect ? 'is-correct' : 'is-incorrect'}`;
      
      let detailText = `あなたの選択: <strong>${item.selected}</strong>`;
      if (!item.isCorrect) {
        detailText += `<br>正解: <span class="ans-highlight" style="font-size:22px; color:#d9534f;">${item.correctAnswer === "この中にはない" ? item.realAns : item.correctAnswer}</span>`;
      }

      let expHTML = item.exp ? `<div class="history-exp">${item.exp}</div>` : '';

      div.innerHTML = `
        <div class="history-q">${item.isCorrect ? '⭕' : '❌'} Q. ${item.promptText}</div>
        <div class="history-ans">${detailText}</div>
        ${expHTML}
      `;
      listDiv.appendChild(div);
    });
  }

  function toggleEditMode() {
    isEditMode = !isEditMode;
    if (isEditMode) {
      hideAllViews();
      document.getElementById('edit-view').style.display = 'block';
      document.getElementById('toggle-mode-btn').textContent = '✕ 閉じる';
    } else {
      showStartView();
      document.getElementById('toggle-mode-btn').textContent = '⚙️ 問題の編集';
    }
  }

  function saveQuestions() {
    const rawText = document.getElementById('data-input').value;
    parseAndSetQuestions(rawText);

    if (questions.length > 0) {
      localStorage.setItem('user_quiz_data', rawText);
      alert("問題データを更新しました！");
      toggleEditMode();
    } else {
      alert("有効な問題データがありません。正しいフォーマットで入力してください。");
    }
  }

  function clearAllData() {
    if (confirm("登録されている問題をすべて消去しますか？")) {
      localStorage.removeItem('user_quiz_data');
      document.getElementById('data-input').value = '';
      questions = [];
      answerPool = [];
      questionPool = [];
      alert("すべてのデータを消去しました。");
    }
  }

  function hideAllViews() {
    document.getElementById('start-view').style.display = 'none';
    document.getElementById('quiz-view').style.display = 'none';
    document.getElementById('result-view').style.display = 'none';
    document.getElementById('edit-view').style.display = 'none';
  }

  init();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>

</body>
</html>
